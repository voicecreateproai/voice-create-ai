<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Create AI Studio</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { background: #1e293b; padding: 30px; border-radius: 15px; width: 100%; max-width: 600px; text-align: center; }
        textarea { width: 100%; height: 180px; background: #000; color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; box-sizing: border-box; }
        select, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; cursor: pointer; }
        button { background: #38bdf8; border: none; font-weight: bold; }
        .footer-text { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎙️ Voice Create AI Studio</h2>
        <div class="footer-text" id="wordCount">Words: 0 / 1500</div>
        
        <textarea id="textInput" oninput="countWords()" placeholder="Type your script here..."></textarea>
        
        <select id="voiceSelect">
            <option value="Aria">Aria (US Female)</option>
            <option value="Guy">Guy (US Male)</option>
            <option value="Sonia">Sonia (UK Female)</option>
            <option value="Ryan">Ryan (UK Male)</option>
            <option value="Natasha">Natasha (AU Female)</option>
            <option value="William">William (AU Male)</option>
            <option value="Jenny">Jenny (US Sweet)</option>
            <option value="Christopher">Christopher (US Pro)</option>
            <option value="Elena">Elena (Soft Female)</option>
            <option value="Ava">Ava (UK Pro)</option>
            <option value="Pooja">Pooja (Hindi Female)</option>
            <option value="Rohan">Rohan (Hindi Male)</option>
            <option value="Nabanita">Nabanita (Bengali Female)</option>
            <option value="Pradeep">Pradeep (Bengali Male)</option>
        </select>

        <button onclick="playVoice()">🚀 Play Voice</button>
        <button onclick="stopVoice()" style="background: #ef4444;">⏹️ Stop Voice</button>
        
        <p class="footer-text">
            <b>টিপস:</b> ভয়েসটি ডাউনলোড করতে তোমার কম্পিউটারের বা ফোনের 'Voice Recorder' অ্যাপটি অন করে 'Play' বাটনে ক্লিক করো। এটিই বর্তমানে সবচেয়ে হাই-কোয়ালিটি এবং নিশ্চিত উপায়।
        </p>
    </div>

    <script>
        function countWords() {
            const text = document.getElementById("textInput").value;
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            document.getElementById("wordCount").innerText = `Words: ${words} / 1500`;
        }

        function playVoice() {
            const text = document.getElementById("textInput").value;
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            if (words > 1500) { alert("Max limit 1500 words!"); return; }
            if (text.trim() === "") { alert("Enter text!"); return; }
            
            const msg = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(msg);
        }

        function stopVoice() {
            window.speechSynthesis.cancel();
        }
    </script>
</body>
</html>
