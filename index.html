<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Create AI Studio</title>
    <!-- ResponsiveVoice API -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=f074d6c6"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 600px; text-align: center; }
        textarea { width: 100%; height: 150px; padding: 10px; border-radius: 8px; margin-top: 10px; background: #0f172a; color: white; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎙️ Voice Create AI</h2>
        <textarea id="script" placeholder="Enter text here..."></textarea>
        <select id="voiceSelect" style="width: 100%; padding: 10px; margin-top: 10px;">
            <option value="US English Female">Aria (US Female)</option>
            <option value="US English Male">Guy (US Male)</option>
            <option value="UK English Female">Sonia (UK Female)</option>
        </select>
        <button onclick="playVoice()">🚀 Play Voice</button>
    </div>

    <script>
        function playVoice() {
            var text = document.getElementById("script").value;
            var voice = document.getElementById("voiceSelect").value;
            if(text.trim() == "") { alert("Please enter text"); return; }
            responsiveVoice.speak(text, voice);
        }
    </script>
</body>
</html>
