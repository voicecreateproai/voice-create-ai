<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Create AI Studio</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; width: 100%; max-width: 600px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; }
        textarea { width: 100%; height: 180px; padding: 12px; border-radius: 8px; margin-top: 10px; background: #0f172a; color: white; border: 1px solid #475569; resize: vertical; box-sizing: border-box; }
        select { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; background: #0f172a; color: white; border: 1px solid #475569; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .limit-info { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; color: #94a3b8; }
        .download-box { margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎙️ Voice Create AI Studio</h2>
        <div class="limit-info">
            <span>Max Limit: 1500 Words</span>
            <span id="wordCounter">Words: 0 / 1500</span>
        </div>
        <textarea id="script" oninput="updateCounter()" placeholder="Type or paste your script here..."></textarea>
        
        <select id="voiceSelect">
            <option value="en-US-AriaNeural">Aria (US Female)</option>
            <option value="en-US-GuyNeural">Guy (US Male)</option>
            <option value="en-US-JennyNeural">Jenny (US Sweet)</option>
            <option value="en-GB-SoniaNeural">Sonia (UK Female)</option>
            <option value="en-GB-RyanNeural">Ryan (UK Male)</option>
            <option value="en-AU-NatashaNeural">Natasha (AU Female)</option>
            <option value="en-AU-WilliamNeural">William (AU Male)</option>
            <option value="en-US-ChristopherNeural">Christopher (US Pro)</option>
            <option value="en-US-SteffanNeural">Steffan (US Male)</option>
            <option value="en-CA-ClaraNeural">Clara (CA Female)</option>
            <option value="en-GB-AvaNeural">Ava (UK Pro)</option>
            <option value="en-US-ElenaNeural">Elena (Soft Female)</option>
            <option value="bn-BD-NabanitaNeural">Nabanita (Bengali Female)</option>
            <option value="bn-BD-PradeepNeural">Pradeep (Bengali Male)</option>
        </select>
        
        <button id="genBtn" onclick="generateVoice()">🚀 Generate Audio</button>

        <div class="download-box" id="downloadArea">
            <p>✅ Audio Ready!</p>
            <audio id="audioPlayer" controls style="width:100%"></audio>
            <br>
            <a id="downloadLink" href="#" download="my_voice.mp3" style="color:#38bdf8; font-weight:bold;">📥 Click to Download MP3</a>
        </div>
    </div>

    <script>
        function updateCounter() {
            const text = document.getElementById("script").value.trim();
            const words = text === '' ? 0 : text.split(/\s+/).length;
            document.getElementById("wordCounter").innerText = `Words: ${words} / 1500`;
        }

        async function generateVoice() {
            const text = document.getElementById("script").value.trim();
            const voice = document.getElementById("voiceSelect").value;
            const btn = document.getElementById("genBtn");
            const downloadArea = document.getElementById("downloadArea");
            const audioPlayer = document.getElementById("audioPlayer");
            const downloadLink = document.getElementById("downloadLink");

            if (text === "") { alert("Please enter text!"); return; }
            
            btn.innerText = "⏳ Processing...";
            btn.disabled = true;

            // এখানে আমরা একটি প্রক্সি সার্ভিস ব্যবহার করছি যাতে কোনো API কী ছাড়াই সরাসরি অডিও জেনারেট হয়
            const url = `https://tts-api.vercel.app/api?text=${encodeURIComponent(text)}&voice=${voice}`;
            
            audioPlayer.src = url;
            downloadLink.href = url;
            downloadArea.style.display = "block";
            
            btn.innerText = "🚀 Generate Audio";
            btn.disabled = false;
        }
    </script>
</body>
</html>
